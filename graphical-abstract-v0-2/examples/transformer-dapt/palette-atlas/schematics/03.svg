<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" font-family="Microsoft YaHei, Noto Sans CJK SC, PingFang SC, Source Han Sans SC, sans-serif" fill="#21252B" width="680" height="420" viewBox="0 0 680 420" role="img" aria-labelledby="title description">
  <title id="title">3  靛蓝—紫</title>
  <desc id="description">极简示意图。采样、检测和观察三个步骤依次用箭头连接。</desc>
  <defs>
