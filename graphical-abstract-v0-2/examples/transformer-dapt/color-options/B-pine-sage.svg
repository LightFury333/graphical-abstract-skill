 id="twelve-month-finding"><rect x="56" y="914" width="1688" height="99" rx="16" fill="url(#conclusion-wash)" /><rect x="56" y="928" width="7" height="70" rx="3.5" fill="#91B990" /><text x="88" y="977" font-size="36">At 12 months, external concordance was 0.74 for ischemic events and 0.75 for bleeding.</text></g><text x="58" y="1069" font-size="24">PCI, percutaneous coronary intervention.</text><text x="1741" y="1069" font-size="24" text-anchor="end">Abdelhameed et al.  ·  Fig. 4a &amp; Table 3  ·  doi: 10.1038/s41746-026-02977-9</text></svg>